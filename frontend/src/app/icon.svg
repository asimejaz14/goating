<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nubian-style goat head: brown coat, long pendulous ears, cream blaze.
       Built from a handful of bold shapes so the silhouette still reads as a
       goat at 16px in a browser tab, where fine detail turns to mush. -->

  <!-- Horns, curving up and back -->
  <path d="M25 8c-3-3-6-5-9-4 1 3 3 6 6 8z" fill="#C79A66" />
  <path d="M39 8c3-3 6-5 9-4-1 3-3 6-6 8z" fill="#C79A66" />

  <!-- Ears: long, narrow and low-hanging -->
  <path
    d="M25 17c-5 2-10 11-11 20-1 7 2 11 5 9 4-2 7-12 7-21 0-4 0-7-1-8z"
    fill="#DDB482"
  />
  <path
    d="M39 17c5 2 10 11 11 20 1 7-2 11-5 9-4-2-7-12-7-21 0-4 0-7 1-8z"
    fill="#DDB482"
  />

  <!-- Neck -->
  <path d="M26 40h12c0 8 1 14 3 19H23c2-5 3-11 3-19z" fill="#5E3018" />

  <!-- Head: broad across the brow, tapering to the muzzle -->
  <path
    d="M32 6c7 0 12 6 12 15 0 9-2 17-5 23-2 4-5 6-7 6s-5-2-7-6c-3-6-5-14-5-23C20 12 25 6 32 6z"
    fill="#7A3E20"
  />

  <!-- Cream blaze down the face and over the muzzle -->
  <path
    d="M32 14c3 0 5 5 5 13 0 9-2 17-5 20-3-3-5-11-5-20 0-8 2-13 5-13z"
    fill="#F2E4CE"
  />

  <!-- Eyes, set on the brow either side of the blaze -->
  <ellipse cx="25.5" cy="20" rx="2.5" ry="3" fill="#9DB9C9" />
  <ellipse cx="25.5" cy="20" rx="1.2" ry="2" fill="#2E2A26" />
  <ellipse cx="38.5" cy="20" rx="2.5" ry="3" fill="#9DB9C9" />
  <ellipse cx="38.5" cy="20" rx="1.2" ry="2" fill="#2E2A26" />

  <!-- Nose -->
  <ellipse cx="32" cy="40" rx="3.2" ry="2.6" fill="#43392F" />
</svg>
