[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's whole dependency system is `Depends()` in argument defaults.
    "B008",
    # Long lines are almost always prose in a docstring.
    "E501",
    # `str, Enum` is deliberate: StrEnum changes what `str(member)` returns, and
    # SQLAlchemy's `values_callable` mapping depends on the `.value` behaviour.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests read better when the assertion is the whole point of the line.
"tests/*" = ["E402"]
